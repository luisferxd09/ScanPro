const L = {
es:['Español','Política de privacidad de ScanPro','Última actualización: 30 de octubre de 2026','ScanPro es una aplicación para escanear documentos, disponible para Android y como versión web (ScanPro web Beta). Está diseñada para que tus documentos se queden en tu dispositivo.','Datos que procesa la app',['<b>Cámara:</b> solo se usa para fotografiar documentos cuando tú lo pides. Las imágenes no se envían a ningún servidor.','<b>Documentos, texto (OCR) y tus datos para formularios:</b> se guardan y procesan solo en tu dispositivo.','<b>Archivos que importas o compartes:</b> solo se leen para crear tus documentos. Las copias de seguridad (por ejemplo, a Google Drive) se hacen solo cuando tú lo eliges.','<b>Idioma y país:</b> se guardan en el dispositivo para mostrar fechas, moneda y tamaño de papel.','<b>Avisos, contactos y huella:</b> los recordatorios se programan en el teléfono; solo se añade un contacto cuando tú lo confirmas; la huella o el PIN los verifica Android y la app nunca los recibe.','<b>Traducir y dictar:</b> la primera vez se descarga el idioma de traducción de Google y después funciona sin internet. El dictado usa el reconocimiento de voz de tu teléfono (Google), que puede procesar el audio en línea según tu configuración.'],'Anuncios (Google AdMob)','La versión gratuita para Android muestra anuncios de Google AdMob. AdMob puede recopilar el identificador de publicidad, la dirección IP y datos de uso de los anuncios para mostrarlos, medirlos y prevenir fraude. Puedes restablecer o eliminar el ID de publicidad en los ajustes de Android. Con ScanPro Pro no se muestran anuncios.','Cómo usa Google los datos','Compras','La compra de ScanPro Pro la gestiona Google Play. ScanPro no recibe tus datos de pago.','Lo que no hacemos','No pedimos cuentas, no vendemos datos, no usamos analítica y no subimos tus documentos a Internet.','Borrar tus datos','Puedes borrar documentos desde la app (Ajustes › Borrar todos los documentos) o desinstalarla, lo que elimina todo. En la versión web, borra los datos del sitio en tu navegador.','Menores','La app no está dirigida a menores de 13 años.','Contacto','Escríbenos a'],
en:['English','ScanPro Privacy Policy','Last updated: 30 October 2026','ScanPro is a document scanning app for Android, also available as a web version (ScanPro web Beta). It is designed so your documents stay on your device.','Data the app processes',['<b>Camera:</b> only used to photograph documents when you ask. Images are never sent to any server.','<b>Documents, text (OCR) and your form details:</b> stored and processed only on your device.','<b>Files you import or share:</b> only read to create your documents. Backups (for example to Google Drive) happen only when you choose.','<b>Language and country:</b> saved on the device to show dates, currency and paper size.','<b>Reminders, contacts and fingerprint:</b> reminders are scheduled on the phone; a contact is added only when you confirm; your fingerprint or PIN is checked by Android and the app never receives it.','<b>Translate and dictate:</b> the first time, Google’s translation language is downloaded; then it works offline. Dictation uses your phone’s speech recognition (Google), which may process audio online depending on your settings.'],'Ads (Google AdMob)','The free Android version shows Google AdMob ads. AdMob may collect the advertising ID, IP address and ad usage data to show and measure ads and prevent fraud. You can reset or delete the advertising ID in Android settings. ScanPro Pro shows no ads.','How Google uses data','Purchases','ScanPro Pro purchases are handled by Google Play. ScanPro never receives your payment details.','What we don’t do','No accounts, no selling data, no analytics and no uploading your documents to the Internet.','Deleting your data','Delete documents in the app (Settings › Delete all documents) or uninstall it, which removes everything. On the web version, clear the site data in your browser.','Children','The app is not directed at children under 13.','Contact','Write to us at'],
pt:['Português','Política de privacidade do ScanPro','Última atualização: 30 de outubro de 2026','O ScanPro é um app para digitalizar documentos, para Android e em versão web (ScanPro web Beta). Ele foi feito para que seus documentos fiquem no seu dispositivo.','Dados que o app processa',['<b>Câmera:</b> usada só para fotografar documentos quando você pede. As imagens não são enviadas a nenhum servidor.','<b>Documentos, texto (OCR) e seus dados de formulário:</b> salvos e processados só no seu dispositivo.','<b>Arquivos que você importa ou compartilha:</b> lidos só para criar seus documentos. Backups (por exemplo no Google Drive) só quando você escolhe.','<b>Idioma e país:</b> salvos no dispositivo para mostrar datas, moeda e tamanho de papel.','<b>Avisos, contatos e digital:</b> os lembretes são agendados no celular; um contato só é adicionado quando você confirma; a digital ou o PIN é verificado pelo Android e o app nunca o recebe.','<b>Traduzir e ditar:</b> na primeira vez o idioma de tradução do Google é baixado; depois funciona offline. O ditado usa o reconhecimento de voz do celular (Google), que pode processar o áudio online conforme suas configurações.'],'Anúncios (Google AdMob)','A versão gratuita para Android mostra anúncios do Google AdMob. O AdMob pode coletar o ID de publicidade, o endereço IP e dados de uso dos anúncios para exibi-los, medi-los e evitar fraudes. Você pode redefinir ou excluir o ID de publicidade nas configurações do Android. Com o ScanPro Pro não há anúncios.','Como o Google usa os dados','Compras','A compra do ScanPro Pro é feita pelo Google Play. O ScanPro não recebe seus dados de pagamento.','O que não fazemos','Sem contas, sem venda de dados, sem analytics e sem enviar seus documentos para a internet.','Apagar seus dados','Apague documentos no app (Configurações › Apagar todos os documentos) ou desinstale-o, o que remove tudo. Na versão web, apague os dados do site no navegador.','Menores','O app não é destinado a menores de 13 anos.','Contato','Escreva para'],
fr:['Français','Politique de confidentialité de ScanPro','Dernière mise à jour : 30 octobre 2026','ScanPro est une application de numérisation de documents pour Android, aussi disponible en version web (ScanPro web Beta). Elle est conçue pour que vos documents restent sur votre appareil.','Données traitées par l’app',['<b>Caméra :</b> utilisée seulement pour photographier des documents à votre demande. Les images ne sont envoyées à aucun serveur.','<b>Documents, texte (OCR) et données de formulaire :</b> enregistrés et traités uniquement sur votre appareil.','<b>Fichiers importés ou partagés :</b> lus seulement pour créer vos documents. Les sauvegardes (par exemple sur Google Drive) ne se font que si vous le choisissez.','<b>Langue et pays :</b> enregistrés sur l’appareil pour afficher dates, devise et format de papier.','<b>Rappels, contacts et empreinte :</b> les rappels sont programmés sur le téléphone ; un contact n’est ajouté qu’après votre confirmation ; l’empreinte ou le PIN est vérifié par Android et l’app ne le reçoit jamais.','<b>Traduire et dicter :</b> la première fois, la langue de traduction de Google est téléchargée ; ensuite hors ligne. La dictée utilise la reconnaissance vocale du téléphone (Google), qui peut traiter l’audio en ligne selon vos réglages.'],'Annonces (Google AdMob)','La version Android gratuite affiche des annonces Google AdMob. AdMob peut collecter l’identifiant publicitaire, l’adresse IP et des données d’usage pour afficher et mesurer les annonces et prévenir la fraude. Vous pouvez réinitialiser ou supprimer l’identifiant publicitaire dans les réglages Android. ScanPro Pro n’affiche pas d’annonces.','Comment Google utilise les données','Achats','L’achat de ScanPro Pro est géré par Google Play. ScanPro ne reçoit pas vos données de paiement.','Ce que nous ne faisons pas','Pas de compte, pas de vente de données, pas d’analytique et pas d’envoi de vos documents sur Internet.','Supprimer vos données','Supprimez vos documents dans l’app (Réglages › Supprimer tous les documents) ou désinstallez-la, ce qui efface tout. Sur la version web, effacez les données du site dans le navigateur.','Mineurs','L’app ne s’adresse pas aux enfants de moins de 13 ans.','Contact','Écrivez-nous à'],
de:['Deutsch','Datenschutzerklärung von ScanPro','Zuletzt aktualisiert: 30. Oktober 2026','ScanPro ist eine Dokumentenscanner-App für Android, auch als Webversion (ScanPro web Beta). Sie ist so gebaut, dass deine Dokumente auf deinem Gerät bleiben.','Welche Daten die App verarbeitet',['<b>Kamera:</b> nur zum Fotografieren von Dokumenten, wenn du es willst. Bilder werden an keinen Server gesendet.','<b>Dokumente, Text (OCR) und deine Formulardaten:</b> nur auf deinem Gerät gespeichert und verarbeitet.','<b>Dateien, die du importierst oder teilst:</b> nur gelesen, um deine Dokumente zu erstellen. Sicherungen (z. B. in Google Drive) nur, wenn du es wählst.','<b>Sprache und Land:</b> auf dem Gerät gespeichert, um Datum, Währung und Papierformat anzuzeigen.','<b>Erinnerungen, Kontakte und Fingerabdruck:</b> Erinnerungen werden auf dem Handy geplant; ein Kontakt wird nur nach deiner Bestätigung angelegt; Fingerabdruck oder PIN prüft Android, die App erhält sie nie.','<b>Übersetzen und Diktieren:</b> Beim ersten Mal wird die Übersetzungssprache von Google geladen, danach offline. Das Diktieren nutzt die Spracherkennung deines Handys (Google), die je nach Einstellung online verarbeiten kann.'],'Anzeigen (Google AdMob)','Die kostenlose Android-Version zeigt Anzeigen von Google AdMob. AdMob kann die Werbe-ID, die IP-Adresse und Nutzungsdaten erfassen, um Anzeigen zu zeigen, zu messen und Betrug zu verhindern. Du kannst die Werbe-ID in den Android-Einstellungen zurücksetzen oder löschen. Mit ScanPro Pro gibt es keine Anzeigen.','Wie Google Daten nutzt','Käufe','Der Kauf von ScanPro Pro läuft über Google Play. ScanPro erhält keine Zahlungsdaten.','Was wir nicht tun','Keine Konten, kein Datenverkauf, keine Analyse und kein Hochladen deiner Dokumente ins Internet.','Deine Daten löschen','Lösche Dokumente in der App (Einstellungen › Alle Dokumente löschen) oder deinstalliere sie, dann ist alles weg. In der Webversion lösche die Website-Daten im Browser.','Kinder','Die App richtet sich nicht an Kinder unter 13 Jahren.','Kontakt','Schreib uns an'],
it:['Italiano','Informativa sulla privacy di ScanPro','Ultimo aggiornamento: 30 ottobre 2026','ScanPro è un’app per scansionare documenti per Android, disponibile anche in versione web (ScanPro web Beta). È pensata perché i tuoi documenti restino sul tuo dispositivo.','Dati trattati dall’app',['<b>Fotocamera:</b> usata solo per fotografare documenti quando lo chiedi. Le immagini non vengono inviate a nessun server.','<b>Documenti, testo (OCR) e dati per i moduli:</b> salvati ed elaborati solo sul tuo dispositivo.','<b>File che importi o condividi:</b> letti solo per creare i tuoi documenti. I backup (per esempio su Google Drive) avvengono solo se lo scegli.','<b>Lingua e paese:</b> salvati sul dispositivo per mostrare date, valuta e formato carta.','<b>Promemoria, contatti e impronta:</b> i promemoria sono programmati sul telefono; un contatto viene aggiunto solo dopo la tua conferma; impronta o PIN li verifica Android e l’app non li riceve mai.','<b>Tradurre e dettare:</b> la prima volta si scarica la lingua di traduzione di Google, poi funziona offline. La dettatura usa il riconoscimento vocale del telefono (Google), che può elaborare l’audio online secondo le tue impostazioni.'],'Annunci (Google AdMob)','La versione Android gratuita mostra annunci di Google AdMob. AdMob può raccogliere l’ID pubblicità, l’indirizzo IP e dati d’uso per mostrare e misurare gli annunci e prevenire frodi. Puoi reimpostare o eliminare l’ID pubblicità nelle impostazioni Android. Con ScanPro Pro non ci sono annunci.','Come Google usa i dati','Acquisti','L’acquisto di ScanPro Pro è gestito da Google Play. ScanPro non riceve i tuoi dati di pagamento.','Cosa non facciamo','Nessun account, nessuna vendita di dati, nessuna analisi e nessun caricamento dei documenti su Internet.','Cancellare i dati','Elimina i documenti dall’app (Impostazioni › Elimina tutti i documenti) o disinstallala, cancellando tutto. Nella versione web, cancella i dati del sito nel browser.','Minori','L’app non è rivolta a minori di 13 anni.','Contatti','Scrivici a'],
zh:['中文','ScanPro 隐私政策','最后更新：2026 年 10 月 30 日','ScanPro 是一款适用于 Android 的文档扫描应用，也有网页版（ScanPro web Beta）。它的设计让你的文档始终留在你的设备上。','应用处理的数据',['<b>相机：</b>仅在你需要时用于拍摄文档。图片不会发送到任何服务器。','<b>文档、文字（OCR）和表单资料：</b>仅在你的设备上保存和处理。','<b>你导入或分享的文件：</b>仅用于创建文档。只有你选择时才会备份（例如到 Google 云端硬盘）。','<b>语言和国家/地区：</b>保存在设备上，用于显示日期、货币和纸张尺寸。','<b>提醒、联系人和指纹：</b>提醒在手机上设定；只有你确认后才会添加联系人；指纹或 PIN 由 Android 验证，应用永远拿不到。','<b>翻译和听写：</b>首次使用会下载 Google 翻译语言包，之后可离线使用。听写使用手机的语音识别（Google），根据设置可能在线处理音频。'],'广告（Google AdMob）','免费的 Android 版会显示 Google AdMob 广告。AdMob 可能收集广告 ID、IP 地址和广告使用数据，用于展示、衡量广告和防止欺诈。你可以在 Android 设置中重置或删除广告 ID。ScanPro Pro 不显示广告。','Google 如何使用数据','购买','ScanPro Pro 的购买由 Google Play 处理。ScanPro 不会收到你的付款信息。','我们不做的事','不需要账号，不出售数据，不做统计分析，也不把你的文档上传到互联网。','删除你的数据','可在应用中删除文档（设置 › 删除所有文档）或卸载应用，这会删除一切。网页版请在浏览器中清除网站数据。','未成年人','本应用不面向 13 岁以下儿童。','联系我们','请写信至'],
hi:['हिन्दी','ScanPro गोपनीयता नीति','अंतिम अपडेट: 30 अक्टूबर 2026','ScanPro Android के लिए दस्तावेज़ स्कैन करने वाला ऐप है, जो वेब संस्करण (ScanPro web Beta) में भी उपलब्ध है। इसे ऐसा बनाया गया है कि आपके दस्तावेज़ आपके डिवाइस पर ही रहें।','ऐप कौन-सा डेटा प्रोसेस करता है',['<b>कैमरा:</b> केवल आपके कहने पर दस्तावेज़ की फ़ोटो लेने के लिए। फ़ोटो किसी सर्वर पर नहीं भेजी जातीं।','<b>दस्तावेज़, टेक्स्ट (OCR) और फ़ॉर्म की जानकारी:</b> केवल आपके डिवाइस पर सहेजी और प्रोसेस की जाती है।','<b>आयात या साझा की गई फ़ाइलें:</b> केवल दस्तावेज़ बनाने के लिए पढ़ी जाती हैं। बैकअप (जैसे Google Drive) तभी होता है जब आप चुनें।','<b>भाषा और देश:</b> तारीख, मुद्रा और कागज़ का आकार दिखाने के लिए डिवाइस पर सहेजे जाते हैं।','<b>रिमाइंडर, संपर्क और फ़िंगरप्रिंट:</b> रिमाइंडर फ़ोन पर तय होते हैं; संपर्क आपकी पुष्टि के बाद ही जुड़ता है; फ़िंगरप्रिंट या PIN Android जाँचता है, ऐप को कभी नहीं मिलता।','<b>अनुवाद और डिक्टेशन:</b> पहली बार Google की अनुवाद भाषा डाउनलोड होती है, फिर बिना इंटरनेट काम करता है। डिक्टेशन फ़ोन की आवाज़ पहचान (Google) इस्तेमाल करता है, जो सेटिंग के अनुसार ऑडियो ऑनलाइन प्रोसेस कर सकती है।'],'विज्ञापन (Google AdMob)','मुफ़्त Android संस्करण Google AdMob विज्ञापन दिखाता है। AdMob विज्ञापन दिखाने, मापने और धोखाधड़ी रोकने के लिए विज्ञापन ID, IP पता और उपयोग डेटा इकट्ठा कर सकता है। आप Android सेटिंग में विज्ञापन ID रीसेट या हटा सकते हैं। ScanPro Pro में विज्ञापन नहीं होते।','Google डेटा का उपयोग कैसे करता है','ख़रीदारी','ScanPro Pro की ख़रीद Google Play संभालता है। ScanPro को आपकी भुगतान जानकारी नहीं मिलती।','हम क्या नहीं करते','कोई खाता नहीं, डेटा की बिक्री नहीं, एनालिटिक्स नहीं और आपके दस्तावेज़ इंटरनेट पर अपलोड नहीं।','अपना डेटा हटाएँ','ऐप में दस्तावेज़ हटाएँ (सेटिंग › सभी दस्तावेज़ हटाएँ) या ऐप अनइंस्टॉल करें, जिससे सब मिट जाता है। वेब संस्करण में ब्राउज़र से साइट डेटा साफ़ करें।','बच्चे','यह ऐप 13 वर्ष से कम उम्र के बच्चों के लिए नहीं है।','संपर्क','हमें लिखें:'],
id:['Indonesia','Kebijakan Privasi ScanPro','Terakhir diperbarui: 30 Oktober 2026','ScanPro adalah aplikasi pemindai dokumen untuk Android, juga tersedia versi web (ScanPro web Beta). Aplikasi ini dirancang agar dokumen Anda tetap di perangkat Anda.','Data yang diproses aplikasi',['<b>Kamera:</b> hanya untuk memotret dokumen saat Anda minta. Gambar tidak dikirim ke server mana pun.','<b>Dokumen, teks (OCR), dan data formulir Anda:</b> disimpan dan diproses hanya di perangkat Anda.','<b>File yang Anda impor atau bagikan:</b> hanya dibaca untuk membuat dokumen. Cadangan (misalnya ke Google Drive) hanya jika Anda memilih.','<b>Bahasa dan negara:</b> disimpan di perangkat untuk menampilkan tanggal, mata uang, dan ukuran kertas.','<b>Pengingat, kontak, dan sidik jari:</b> pengingat dijadwalkan di ponsel; kontak hanya ditambahkan setelah Anda konfirmasi; sidik jari atau PIN diperiksa Android dan aplikasi tidak pernah menerimanya.','<b>Terjemahan dan dikte:</b> pertama kali, bahasa terjemahan Google diunduh, lalu bisa offline. Dikte memakai pengenalan suara ponsel (Google), yang dapat memproses audio secara online tergantung pengaturan.'],'Iklan (Google AdMob)','Versi Android gratis menampilkan iklan Google AdMob. AdMob dapat mengumpulkan ID iklan, alamat IP, dan data penggunaan iklan untuk menampilkan, mengukur, dan mencegah penipuan. Anda bisa mereset atau menghapus ID iklan di pengaturan Android. ScanPro Pro tanpa iklan.','Cara Google menggunakan data','Pembelian','Pembelian ScanPro Pro ditangani Google Play. ScanPro tidak menerima data pembayaran Anda.','Yang tidak kami lakukan','Tanpa akun, tidak menjual data, tanpa analitik, dan tidak mengunggah dokumen Anda ke internet.','Menghapus data Anda','Hapus dokumen di aplikasi (Pengaturan › Hapus semua dokumen) atau copot aplikasi, yang menghapus semuanya. Di versi web, hapus data situs di browser.','Anak-anak','Aplikasi ini tidak ditujukan untuk anak di bawah 13 tahun.','Kontak','Tulis ke'],
ru:['Русский','Политика конфиденциальности ScanPro','Последнее обновление: 30 октября 2026 г.','ScanPro — приложение для сканирования документов на Android, также есть веб-версия (ScanPro web Beta). Оно устроено так, чтобы ваши документы оставались на вашем устройстве.','Какие данные обрабатывает приложение',['<b>Камера:</b> используется только для съёмки документов по вашему запросу. Изображения не отправляются на серверы.','<b>Документы, текст (OCR) и данные для форм:</b> хранятся и обрабатываются только на устройстве.','<b>Импортируемые и отправляемые файлы:</b> читаются только для создания документов. Резервные копии (например, в Google Диск) — только по вашему выбору.','<b>Язык и страна:</b> хранятся на устройстве для отображения дат, валюты и формата бумаги.','<b>Напоминания, контакты и отпечаток:</b> напоминания планируются на телефоне; контакт добавляется только после вашего подтверждения; отпечаток или PIN проверяет Android, приложение их не получает.','<b>Перевод и диктовка:</b> в первый раз скачивается языковой пакет Google, потом работает без интернета. Диктовка использует распознавание речи телефона (Google), которое может обрабатывать звук онлайн в зависимости от настроек.'],'Реклама (Google AdMob)','Бесплатная версия для Android показывает рекламу Google AdMob. AdMob может собирать рекламный идентификатор, IP-адрес и данные об использовании рекламы для показа, измерения и защиты от мошенничества. Рекламный ID можно сбросить или удалить в настройках Android. В ScanPro Pro рекламы нет.','Как Google использует данные','Покупки','Покупку ScanPro Pro обрабатывает Google Play. ScanPro не получает ваши платёжные данные.','Чего мы не делаем','Без аккаунтов, без продажи данных, без аналитики и без загрузки ваших документов в интернет.','Удаление данных','Удалите документы в приложении (Настройки › Удалить все документы) или удалите приложение — всё будет стёрто. В веб-версии очистите данные сайта в браузере.','Дети','Приложение не предназначено для детей младше 13 лет.','Контакты','Пишите нам:'],
tr:['Türkçe','ScanPro Gizlilik Politikası','Son güncelleme: 30 Ekim 2026','ScanPro, Android için bir belge tarama uygulamasıdır; web sürümü de vardır (ScanPro web Beta). Belgeleriniz cihazınızda kalacak şekilde tasarlanmıştır.','Uygulamanın işlediği veriler',['<b>Kamera:</b> yalnızca siz istediğinizde belge fotoğraflamak için. Görüntüler hiçbir sunucuya gönderilmez.','<b>Belgeler, metin (OCR) ve form bilgileriniz:</b> yalnızca cihazınızda saklanır ve işlenir.','<b>İçe aktardığınız veya paylaştığınız dosyalar:</b> yalnızca belge oluşturmak için okunur. Yedekler (ör. Google Drive) yalnızca siz seçerseniz yapılır.','<b>Dil ve ülke:</b> tarih, para birimi ve kâğıt boyutunu göstermek için cihazda saklanır.','<b>Hatırlatıcılar, kişiler ve parmak izi:</b> hatırlatıcılar telefonda planlanır; kişi yalnızca onayınızla eklenir; parmak izi veya PIN’i Android doğrular, uygulama asla almaz.','<b>Çeviri ve dikte:</b> ilk seferde Google çeviri dili indirilir, sonra internetsiz çalışır. Dikte, telefonunuzun ses tanımasını (Google) kullanır; ayarlarınıza göre ses çevrimiçi işlenebilir.'],'Reklamlar (Google AdMob)','Ücretsiz Android sürümü Google AdMob reklamları gösterir. AdMob, reklamları göstermek, ölçmek ve dolandırıcılığı önlemek için reklam kimliği, IP adresi ve kullanım verileri toplayabilir. Reklam kimliğini Android ayarlarından sıfırlayabilir veya silebilirsiniz. ScanPro Pro’da reklam yoktur.','Google verileri nasıl kullanır','Satın almalar','ScanPro Pro satın alımını Google Play yönetir. ScanPro ödeme bilgilerinizi almaz.','Yapmadıklarımız','Hesap yok, veri satışı yok, analiz yok ve belgelerinizi internete yüklemek yok.','Verilerinizi silme','Belgeleri uygulamadan silin (Ayarlar › Tüm belgeleri sil) veya uygulamayı kaldırın; her şey silinir. Web sürümünde tarayıcıdan site verilerini temizleyin.','Çocuklar','Uygulama 13 yaşından küçük çocuklara yönelik değildir.','İletişim','Bize yazın:'],
vi:['Tiếng Việt','Chính sách quyền riêng tư của ScanPro','Cập nhật lần cuối: 30 tháng 10 năm 2026','ScanPro là ứng dụng quét tài liệu cho Android, có cả bản web (ScanPro web Beta). Ứng dụng được thiết kế để tài liệu của bạn luôn ở trên thiết bị.','Dữ liệu ứng dụng xử lý',['<b>Camera:</b> chỉ dùng để chụp tài liệu khi bạn yêu cầu. Ảnh không được gửi tới máy chủ nào.','<b>Tài liệu, chữ (OCR) và thông tin biểu mẫu:</b> chỉ lưu và xử lý trên thiết bị.','<b>Tệp bạn nhập hoặc chia sẻ:</b> chỉ được đọc để tạo tài liệu. Sao lưu (ví dụ Google Drive) chỉ khi bạn chọn.','<b>Ngôn ngữ và quốc gia:</b> lưu trên thiết bị để hiển thị ngày, tiền tệ và khổ giấy.','<b>Nhắc nhở, danh bạ và vân tay:</b> nhắc nhở được hẹn trên điện thoại; danh bạ chỉ được thêm khi bạn xác nhận; vân tay hoặc PIN do Android kiểm tra, ứng dụng không bao giờ nhận được.','<b>Dịch và đọc chính tả:</b> lần đầu sẽ tải gói ngôn ngữ dịch của Google, sau đó dùng không cần mạng. Đọc chính tả dùng nhận dạng giọng nói của điện thoại (Google), có thể xử lý âm thanh trực tuyến tùy cài đặt.'],'Quảng cáo (Google AdMob)','Bản Android miễn phí hiển thị quảng cáo Google AdMob. AdMob có thể thu thập ID quảng cáo, địa chỉ IP và dữ liệu sử dụng để hiển thị, đo lường quảng cáo và chống gian lận. Bạn có thể đặt lại hoặc xóa ID quảng cáo trong cài đặt Android. ScanPro Pro không có quảng cáo.','Cách Google sử dụng dữ liệu','Mua hàng','Việc mua ScanPro Pro do Google Play xử lý. ScanPro không nhận thông tin thanh toán của bạn.','Những điều chúng tôi không làm','Không tài khoản, không bán dữ liệu, không phân tích và không tải tài liệu của bạn lên Internet.','Xóa dữ liệu','Xóa tài liệu trong ứng dụng (Cài đặt › Xóa tất cả tài liệu) hoặc gỡ ứng dụng để xóa hết. Với bản web, hãy xóa dữ liệu trang trong trình duyệt.','Trẻ em','Ứng dụng không dành cho trẻ dưới 13 tuổi.','Liên hệ','Viết cho chúng tôi:'],
ja:['日本語','ScanPro プライバシーポリシー','最終更新日：2026 年 10 月 30 日','ScanPro は Android 向けの書類スキャンアプリで、Web 版（ScanPro web Beta）もあります。書類が端末内にとどまるよう設計されています。','アプリが扱うデータ',['<b>カメラ：</b>あなたが求めたときだけ書類の撮影に使います。画像はどのサーバーにも送られません。','<b>書類・文字（OCR）・フォーム用の情報：</b>端末内だけで保存・処理されます。','<b>読み込み・共有したファイル：</b>書類の作成のためだけに読み取ります。バックアップ（Google ドライブなど）はあなたが選んだときだけです。','<b>言語と国：</b>日付・通貨・用紙サイズの表示のため端末に保存されます。','<b>リマインダー・連絡先・指紋：</b>リマインダーは端末内で設定され、連絡先はあなたが確認したときだけ追加されます。指紋や PIN は Android が確認し、アプリが受け取ることはありません。','<b>翻訳と音声入力：</b>初回に Google の翻訳言語データをダウンロードし、以降はオフラインで動作します。音声入力は端末の音声認識（Google）を使い、設定によっては音声がオンラインで処理されます。'],'広告（Google AdMob）','無料の Android 版では Google AdMob の広告が表示されます。AdMob は広告の表示・測定・不正防止のため、広告 ID、IP アドレス、利用データを収集することがあります。広告 ID は Android の設定でリセットまたは削除できます。ScanPro Pro では広告は表示されません。','Google によるデータの使用','購入','ScanPro Pro の購入は Google Play が処理します。ScanPro が支払い情報を受け取ることはありません。','私たちがしないこと','アカウント不要、データの販売なし、分析なし、書類をインターネットにアップロードしません。','データの削除','アプリ内で書類を削除する（設定 › すべての書類を削除）か、アンインストールするとすべて消えます。Web 版ではブラウザでサイトデータを削除してください。','お子様','本アプリは 13 歳未満の子どもを対象としていません。','お問い合わせ','連絡先：'],
ko:['한국어','ScanPro 개인정보 처리방침','최종 업데이트: 2026년 10월 30일','ScanPro는 Android용 문서 스캔 앱이며 웹 버전(ScanPro web Beta)도 있습니다. 문서가 기기 안에만 머물도록 설계되었습니다.','앱이 처리하는 데이터',['<b>카메라:</b> 요청할 때만 문서 촬영에 사용합니다. 이미지는 어떤 서버로도 전송되지 않습니다.','<b>문서, 텍스트(OCR), 양식용 정보:</b> 기기에서만 저장·처리됩니다.','<b>가져오거나 공유하는 파일:</b> 문서를 만들 때만 읽습니다. 백업(예: Google 드라이브)은 직접 선택할 때만 합니다.','<b>언어와 국가:</b> 날짜, 통화, 용지 크기를 표시하려고 기기에 저장됩니다.','<b>알림, 연락처, 지문:</b> 알림은 휴대폰에서 예약되고, 연락처는 확인할 때만 추가됩니다. 지문이나 PIN은 Android가 확인하며 앱은 받지 않습니다.','<b>번역과 받아쓰기:</b> 처음에 Google 번역 언어 데이터를 내려받고 이후에는 오프라인으로 작동합니다. 받아쓰기는 휴대폰의 음성 인식(Google)을 사용하며 설정에 따라 음성이 온라인으로 처리될 수 있습니다.'],'광고(Google AdMob)','무료 Android 버전은 Google AdMob 광고를 표시합니다. AdMob은 광고 표시·측정 및 사기 방지를 위해 광고 ID, IP 주소, 사용 데이터를 수집할 수 있습니다. 광고 ID는 Android 설정에서 재설정하거나 삭제할 수 있습니다. ScanPro Pro에는 광고가 없습니다.','Google의 데이터 사용 방식','구매','ScanPro Pro 구매는 Google Play가 처리합니다. ScanPro는 결제 정보를 받지 않습니다.','하지 않는 일','계정 없음, 데이터 판매 없음, 분석 없음, 문서를 인터넷에 올리지 않습니다.','데이터 삭제','앱에서 문서를 삭제(설정 › 모든 문서 삭제)하거나 앱을 제거하면 모두 지워집니다. 웹 버전은 브라우저에서 사이트 데이터를 지우세요.','어린이','이 앱은 13세 미만 어린이를 대상으로 하지 않습니다.','문의','연락처:'],
ar:['العربية','سياسة الخصوصية لتطبيق ScanPro','آخر تحديث: 30 أكتوبر 2026','ScanPro تطبيق لمسح المستندات على Android، ومتاح أيضًا كنسخة ويب (ScanPro web Beta). صُمم لتبقى مستنداتك على جهازك.','البيانات التي يعالجها التطبيق',['<b>الكاميرا:</b> تُستخدم فقط لتصوير المستندات عندما تطلب ذلك. لا تُرسل الصور إلى أي خادم.','<b>المستندات والنص (OCR) وبيانات النماذج:</b> تُحفظ وتُعالج على جهازك فقط.','<b>الملفات التي تستوردها أو تشاركها:</b> تُقرأ فقط لإنشاء مستنداتك. لا يتم النسخ الاحتياطي (مثل Google Drive) إلا إذا اخترت ذلك.','<b>اللغة والبلد:</b> يُحفظان على الجهاز لعرض التاريخ والعملة وحجم الورق.','<b>التذكيرات وجهات الاتصال والبصمة:</b> تُجدول التذكيرات على الهاتف؛ لا تُضاف جهة اتصال إلا بعد تأكيدك؛ يتحقق Android من البصمة أو الرمز ولا يحصل عليها التطبيق أبدًا.','<b>الترجمة والإملاء:</b> في المرة الأولى تُنزَّل لغة الترجمة من Google ثم يعمل دون إنترنت. يستخدم الإملاء التعرّف على الكلام في هاتفك (Google)، وقد يعالج الصوت عبر الإنترنت حسب إعداداتك.'],'الإعلانات (Google AdMob)','تعرض نسخة Android المجانية إعلانات Google AdMob. قد يجمع AdMob معرّف الإعلانات وعنوان IP وبيانات الاستخدام لعرض الإعلانات وقياسها ومنع الاحتيال. يمكنك إعادة تعيين معرّف الإعلانات أو حذفه من إعدادات Android. لا توجد إعلانات في ScanPro Pro.','كيف تستخدم Google البيانات','المشتريات','يتولى Google Play شراء ScanPro Pro. لا يتلقى ScanPro بيانات الدفع الخاصة بك.','ما لا نفعله','لا حسابات، ولا بيع للبيانات، ولا تحليلات، ولا رفع لمستنداتك إلى الإنترنت.','حذف بياناتك','احذف المستندات من التطبيق (الإعدادات › حذف كل المستندات) أو ألغِ تثبيته فيُحذف كل شيء. في نسخة الويب امسح بيانات الموقع من المتصفح.','الأطفال','التطبيق غير موجّه للأطفال دون 13 عامًا.','التواصل','راسلنا على'],
};
const pick = () => { const q = new URLSearchParams(location.search).get('lang'); if (q && L[q]) return q; let s; try { s = JSON.parse(localStorage.getItem('scanpro.settings.v1') || '{}').lang; } catch {} if (s && L[s]) return s; const n = (navigator.language || 'es').slice(0, 2); return L[n] ? n : 'en'; };
function show(c) {
  const t = L[c];
  document.documentElement.lang = c; document.documentElement.dir = c === 'ar' ? 'rtl' : 'ltr'; document.title = 'ScanPro · ' + t[1];
  document.getElementById('doc').innerHTML = `<h1>${t[1]}</h1><p><small>${t[2]}</small></p><p>${t[3]}</p><h2>${t[4]}</h2><ul>${t[5].map(x => `<li>${x}</li>`).join('')}</ul><h2>${t[6]}</h2><p>${t[7]} <a href="${ADS}" rel="noopener">${t[8]}</a>.</p><h2>${t[9]}</h2><p>${t[10]}</p><h2>${t[11]}</h2><p>${t[12]}</p><h2>${t[13]}</h2><p>${t[14]}</p><h2>${t[15]}</h2><p>${t[16]}</p><h2>${t[17]}</h2><p>${t[18]} <a href="mailto:${MAIL}">${MAIL}</a>.</p>`;
  document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.l === c));
}
document.getElementById('langs').append(...Object.entries(L).map(([c, t]) => { const b = document.createElement('button'); b.textContent = t[0]; b.dataset.l = c; b.onclick = () => { show(c); history.replaceState(null, '', '?lang=' + c); }; return b; }));
show(pick());
</script>
</body>
</html>
